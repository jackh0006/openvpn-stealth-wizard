version: 2
project_name: openvpn-stealth-wizard
builds:
  - id: wizard
    main: ./cmd/wizard
    binary: wizard
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-buildvcs=false]
    ldflags: [-s -w]
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
checksum:
  name_template: checksums.txt
