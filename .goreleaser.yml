version: 2
project_name: openvpn-stealth-wizard
builds:
  - id: wizard
    main: ./cmd/wizard
    binary: wizard
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-buildvcs=false]
    ldflags: [-s -w]
archives:
  - formats: [tar.gz]
    # Canonical names (stable scheme, matches account convention):
    #   openvpn-stealth-wizard-<ver>-Linux-amd64.tar.gz
    name_template: "{{ .ProjectName }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
checksum:
  name_template: checksums.txt
