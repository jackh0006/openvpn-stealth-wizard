name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Versionless aliases keep install URLs stable forever (see README).
      - name: Upload stable-name aliases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          cd dist
          for f in openvpn-stealth-wizard-"$VER"-Linux-*.tar.gz; do
            alias="${f/$VER-/}"
            cp "$f" "$alias"
          done
          sha256sum openvpn-stealth-wizard-*.tar.gz > SHA256SUMS.txt
          gh release upload "${GITHUB_REF_NAME}" --clobber openvpn-stealth-wizard-Linux-*.tar.gz SHA256SUMS.txt
